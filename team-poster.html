<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ประกาศทีม — กีฬาสี 14 พ.ย.</title>
<!-- A4 poster of one team (?team=red or ?team=blue), same paper (Riso) theme as the app. It reads the real player list and photos from the database,
     so a player whose photo arrives later shows up after a refresh. ?shot=1 hides the toolbar (for making an image). -->
<script>document.documentElement.setAttribute('data-theme', 'paper');</script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kanit:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css?v=2026.10.30.78">
<link rel="stylesheet" href="css/paper.css?v=2026.10.30.78">
<style>
  :root { --tp-ink: #0b2a52; --tp-cream: #fff6ea; --tp-yellow: #f4c430; }
  body.is-red { --tc: #d81a21; --tc-dark: #9b1017; }
  body.is-blue { --tc: #0956b8; --tc-dark: #063b82; }
  html, body { margin: 0; background: #d9d2c3; font-family: var(--font-th, 'Noto Sans Thai', sans-serif); color: var(--tp-ink); }
  .tp-bar { display: flex; gap: 10px; justify-content: center; padding: 12px; }
  .tp-bar button, .tp-bar a { min-height: 44px; padding: 0 18px; border: 1.5px solid var(--tp-ink); border-radius: 4px 9px 5px 10px / 10px 5px 9px 4px; background: var(--tp-yellow); color: var(--tp-ink); font: 700 16px/1 var(--font-th-head, Kanit, sans-serif); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .tp-stage { display: flex; justify-content: center; padding-bottom: 24px; }
  .tp-sheet { position: relative; width: 210mm; height: 297mm; box-sizing: border-box; padding: 11mm 12mm 9mm; overflow: hidden; background: var(--tp-cream); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 3mm; transform-origin: top center; }
  .tp-sheet::before { content: ''; position: absolute; inset: 0; background: url(media/riso/grain-paper.webp) center / 520px; mix-blend-mode: multiply; opacity: .55; pointer-events: none; }
  .tp-sheet > * { position: relative; }

  /* the team banner: the colour field is a pseudo-element, no text inside a masked box */
  .tp-head { position: relative; isolation: isolate; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4mm; padding: 4.5mm 10mm 4.5mm 12mm; color: var(--tp-cream); }
  .tp-head::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle, rgba(255, 246, 234, .17) .35mm, transparent .5mm) 0 0 / 1.9mm 1.9mm, var(--tc);
    -webkit-mask: var(--riso-ragged) center / 100% 100% no-repeat; mask: var(--riso-ragged) center / 100% 100% no-repeat; }
  .tp-kick { font-family: var(--font-num, Anton, sans-serif); font-size: 5.6mm; letter-spacing: .16em; opacity: .92; line-height: 1; }
  .tp-name { margin: 1mm 0 0; font-family: var(--font-num, Anton, sans-serif); font-weight: 400; font-size: 21mm; letter-spacing: .05em; line-height: 1; }
  .tp-count { margin: 1.5mm 0 0; font-family: var(--font-th-head, Kanit, sans-serif); font-weight: 700; font-size: 6.4mm; }
  .tp-star { width: 34mm; height: auto; filter: drop-shadow(1.1mm 1.3mm 0 rgba(11, 42, 82, .35)); transform: rotate(-4deg); }

  .tp-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; align-items: start; justify-items: center; gap: 0 2mm; padding-top: 2mm; }
  .tp-p { display: grid; justify-items: center; gap: 0; width: 100%; position: relative; }
  .tp-av { --s: 22mm; position: relative; width: var(--s); height: var(--s); margin: calc(var(--s) * .2); }
  .tp-av img, .tp-av .tp-ini { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 12%; }   /* keep the top of the picture: heads, not feet */
  .tp-av .tp-ini { display: grid; place-items: center; background: var(--tp-yellow); color: var(--tp-ink); font-family: var(--font-th-head, Kanit, sans-serif); font-weight: 800; font-size: 9mm; }
  .tp-av::after { content: ''; position: absolute; inset: -19%; background: var(--ring) center / 100% 100% no-repeat; pointer-events: none; }
  .tp-nm { font-family: var(--font-th-head, Kanit, sans-serif); font-weight: 800; font-size: 5.4mm; line-height: 1.1; text-align: center; max-width: 100%; margin-top: -1mm; overflow-wrap: anywhere; }
  .tp-badge { position: absolute; top: 0; right: 2mm; padding: .6mm 2.6mm 1mm; font-family: var(--font-th-head, Kanit, sans-serif); font-weight: 800; font-size: 3.4mm; line-height: 1.2; background: url(media/riso/marker-yellow-2.webp) center / 100% 100% no-repeat; }
  .tp-badge.is-new { background: var(--tp-cream); border: .5mm solid var(--tp-ink); border-radius: 1mm 2mm 1.2mm 2.4mm / 2.4mm 1.2mm 2mm 1mm; font-size: 3mm; }
  .tp-cap .tp-av { --s: 23.5mm; }
  .tp-foot { display: flex; justify-content: space-between; align-items: center; font-size: 4mm; font-weight: 700; }
  .tp-foot b { font-family: var(--font-num, Anton, sans-serif); font-weight: 400; letter-spacing: .12em; color: var(--tc); font-size: 5mm; }
  .tp-err { align-self: center; text-align: center; font-size: 6mm; }

  .tp-shot { background: none; }
  .tp-shot .tp-bar { display: none; }
  .tp-shot .tp-stage { padding: 0; display: block; }
  .tp-shot .tp-sheet { transform: none !important; }
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: none; }
    .tp-bar { display: none; }
    .tp-stage { display: block; padding: 0; }
    .tp-sheet { transform: none !important; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body class="is-red">
<div class="tp-bar">
  <button type="button" id="tpPrint">พิมพ์ / บันทึกเป็น PDF</button>
  <a href="?team=red" id="tpR">แผ่นทีมแดง</a>
  <a href="?team=blue" id="tpB">แผ่นทีมน้ำเงิน</a>
</div>
<div class="tp-stage"><main class="tp-sheet" id="tpSheet">
  <header class="tp-head">
    <div><div class="tp-kick">SPORTS DAY · 14 NOV 2026</div><h1 class="tp-name" id="tpName">RED TEAM</h1><p class="tp-count" id="tpCount">กำลังโหลด…</p></div>
    <img class="tp-star" src="media/mascot/champion.webp" alt="">
  </header>
  <section class="tp-grid" id="tpGrid"></section>
  <footer class="tp-foot"><span>กีฬาสี เสาร์ที่ 14 พ.ย. 2569</span><b id="tpFoot">RED</b><span>เจอกันที่สนาม!</span></footer>
</main></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var TEAM = q.get('team') === 'blue' ? 'Blue' : 'Red', lc = TEAM.toLowerCase();
  var CAPTAIN = { Red: 'หมี', Blue: 'เพชร' };
  var NEW = ['พล', 'ไทม์', 'อาร์ม', 'นาย', 'แม็กซ์', 'รุจิ'];
  var U = 'https://badminton-2026-687e7-default-rtdb.asia-southeast1.firebasedatabase.app';
  document.body.className = 'is-' + lc + (/[?&]shot=1(?:&|$)/.test(location.search) ? ' tp-shot' : '');
  document.getElementById('tpName').textContent = TEAM.toUpperCase() + ' TEAM';
  document.getElementById('tpFoot').textContent = TEAM.toUpperCase();
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ini(n) { var s = String(n).replace(/\s+/g, '').replace(/^พี่(?=.)/, ''), m = s.match(/^[เแโใไ]?[ก-ฮ][ัิ-ฺ็-๎]*/); return m ? m[0] : s.slice(0, 2); }
  function build(players, photos) {
    var list = (players || []).filter(function (p) { return p.team === TEAM; });
    list.sort(function (a, b) {
      if ((a.name === CAPTAIN[TEAM]) !== (b.name === CAPTAIN[TEAM])) return a.name === CAPTAIN[TEAM] ? -1 : 1;
      return String(a.sub || '9').localeCompare(String(b.sub || '9')) || String(a.id).localeCompare(String(b.id));
    });
    document.getElementById('tpCount').textContent = list.length + ' คน';
    var missing = 0;
    document.getElementById('tpGrid').innerHTML = list.map(function (p, i) {
      var ph = photos && photos[p.id] && photos[p.id].photo, cap = p.name === CAPTAIN[TEAM], isNew = NEW.indexOf(p.name) >= 0;
      if (!ph) missing++;
      return '<div class="tp-p' + (cap ? ' tp-cap' : '') + '"><div class="tp-av" style="--ring:url(media/riso/ring-' + lc + '-' + (i % 3 + 1) + '.webp)">' +
        (ph ? '<img src="' + esc(ph) + '" alt="">' : '<span class="tp-ini">' + esc(ini(p.name)) + '</span>') + '</div><div class="tp-nm">' + esc(p.name) + '</div>' +
        (cap ? '<span class="tp-badge">หัวหน้าทีม</span>' : isNew ? '<span class="tp-badge is-new">NEW</span>' : '') + '</div>';
    }).join('');
    document.body.setAttribute('data-ready', '1'); document.body.setAttribute('data-missing', String(missing));
  }
  Promise.all([fetch(U + '/sportsday_2026_data/players.json').then(function (r) { return r.json(); }), fetch(U + '/sportsday_2026_photos.json').then(function (r) { return r.json(); })])
    .then(function (r) { build(r[0], r[1]); })
    .catch(function () { document.getElementById('tpGrid').innerHTML = '<p class="tp-err">โหลดรายชื่อไม่สำเร็จ ลองรีเฟรช</p>'; });
  document.getElementById('tpPrint').onclick = function () { window.print(); };
  var sheet = document.getElementById('tpSheet'), stage = sheet.parentNode;
  function fit() { var s = Math.min(1, (window.innerWidth - 16) / sheet.offsetWidth); sheet.style.transform = s < 1 ? 'scale(' + s + ')' : ''; stage.style.height = s < 1 ? Math.ceil(sheet.offsetHeight * s + 24) + 'px' : ''; }
  window.addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
